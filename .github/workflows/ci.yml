name: FINTIGEN CI

on:
  pull_request:
  push:
    branches:
      - claude/fintigen-academy-structure-20s7jk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint grant-facing changes
        run: >-
          npx eslint
          "src/lib/courses/ai-safety-security.ts"
          "src/app/learn/ai-safety-security/page.tsx"
          "src/app/(site)/ai-safety-fellowship/page.tsx"
          "src/lib/data.ts"
          "src/app/(site)/courses/page.tsx"
          "src/app/(site)/ai-safety-fellowship/assessment/page.tsx"
          "src/components/fellowship/FellowshipAssessment.tsx"
          "src/lib/fellowship-evaluation.ts"

      - name: Report existing repository lint debt
        continue-on-error: true
        run: npm run lint

      - name: Production build
        run: npm run build
